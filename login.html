<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Utilería JS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="contenedor">
        <h1> Iniciar Sesión</h1>
        <p class="subtitulo"> Ingresa tus credenciales</p>
        <form class="formulario">
            <div class="grupo-formulario">
                <label for="loginCorreo"> Correo Electrónico:</label>
                <input type="text" id="loginCorreo" placeholder="Tu correo">
            </div>
            <div class="grupo-formulario">
                <label for="loginPassword"> Contraseña:</label>
                <input type="password" id="loginPassword" placeholder="Tu contraseña">
                <small class="ayuda"> Mínimo 8 caracteres, 1 mayúscula, 1 minúscula, 1 número y 1 especial.</small>
            </div>
            <div id="login-error" class="error-msg"></div>
            <div id="login-exito" class="exito-msg"></div>
            <button type="button" onclick="procesarLogin()" class="boton-calcular">Ingresar</button>
        </form>
        <br>
        <a href="index.html" class="enlace">Volver al Registro</a>
    </div>
    <script src="js/utileria.js"></script>
    <script>
        function procesarLogin() {
            const correo = document.getElementById("loginCorreo").value;
            const password =document.getElementById("loginPassword").value;
            const msgError =document.getElementById("login-error");
            const msgExito = document.getElementById("login-exito");
            msgError.textContent = "";
            msgExito.textContent = "";
            if (!validarCorreo(correo)) {
                msgError.textContent = "Formato de correo no válido";
                return;
            }
            if (!validarPassword(password)) {
                msgError.textContent = "La contraseña no cumple con los requisitos";
                return;
            }
            msgExito.textContent =
                "Ingresando...";
        }
    </script>
</body>
</html>
